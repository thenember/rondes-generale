<!--
================================================================================
  GUIDE DE RONDE  -  version 2
================================================================================

  Fonctionne sans internet. Ne communique avec aucun serveur.
  Ne remplace pas le pointage : l'agent valide toujours avec son PTI.

  ------------------------------------------------------------------
  RANGEMENT
  ------------------------------------------------------------------
      Ronde/
        guide-ronde.html
        photos/            <- toutes les photos annotees

  ------------------------------------------------------------------
  NOMMAGE DES PHOTOS
  ------------------------------------------------------------------
  Numero du pointeau, puis ordre d'apparition :

      P01-1.jpg  P01-2.jpg
      P07-1.jpg  P07-2.jpg  P07-3.jpg  P07-4.jpg
      ...

  Chaque pointeau a 4 emplacements photo prevus. TU N'AS RIEN A MODIFIER :
  les emplacements sans photo disparaissent tout seuls et les etapes se
  renumerotent. Mets 1 photo, 2, 3 ou 4 selon le pointeau, c'est tout.

  Il t'en faut une 5e sur un pointeau ? Ajoute une ligne
  { img: "photos/P07-5.jpg", texte: "" } dans son bloc "etapes".

  ------------------------------------------------------------------
  REMPLISSAGE
  ------------------------------------------------------------------
  Les 36 blocs sont deja crees. Pour chacun :

    nom     : le lieu, tel que l'agent le dit  ("Local TGBT", "Palier -1")
    statut  : laisser vide si tout est normal.
              "absent"    -> affiche "Pointeau absent"
              "difficile" -> affiche "Pointeau peu visible"
    position: "interne" ou "externe" - ou se trouve le pointeau par rapport
              au local. Laisser vide si la question ne se pose pas.
    acces   : cle, badge, absence de reseau...  (laisser vide si rien)
    texte   : ce que l'agent doit faire A CETTE ETAPE.
              Court, a l'imperatif. "Prendre l'escalier de service jusqu'au -1."

  Une etape sans photo affiche quand meme son texte : pratique pour une
  consigne pure ("Refermer la porte derriere soi").

  ------------------------------------------------------------------
  UTILISATION
  ------------------------------------------------------------------
  Telephone : balayer vers la gauche pour le pointeau suivant.
              Le bouton en haut a gauche ouvre la liste des 36.
  PDF       : Fichier > Imprimer > Enregistrer en PDF.

================================================================================
-->

<style>
  :root{
    --nuit:#14100D; --surface:#1F1915; --surface-2:#2A231D; --ligne:#3A312A;
    --ambre:#FFB01F; --rouge:#E3000F; --vert:#00A651;
    --texte:#EDE6DD; --sourdine:#9A8F84;
    --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--nuit); color:var(--texte); font-family:var(--sans);
    font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  :focus-visible{ outline:3px solid var(--ambre); outline-offset:2px; }

  /* ---------- barre ---------- */
  .barre{
    position:sticky; top:0; z-index:20; background:var(--nuit);
    border-bottom:1px solid var(--ligne); padding:env(safe-area-inset-top) 14px 0;
  }
  .barre-haut{ display:flex; align-items:center; gap:10px; padding:11px 0 9px; }
  .ico{
    background:var(--surface-2); border:1px solid var(--ligne); color:var(--texte);
    border-radius:7px; padding:8px 11px; font-size:15px; cursor:pointer;
    font-family:var(--sans); line-height:1;
  }
  .titre{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.14em; }
  .selecteur{
    margin-left:auto; background:var(--surface-2); color:var(--texte);
    border:1px solid var(--ligne); border-radius:6px;
    font-family:var(--sans); font-size:14px; padding:7px 9px;
  }
  .jauge{ height:3px; background:var(--surface-2); display:flex; gap:1px; }
  .jauge span{ flex:1; background:var(--ligne); }
  .jauge span.faite{ background:var(--ambre); }
  .jauge span.active{ background:var(--rouge); }

  /* ---------- sommaire ---------- */
  .sommaire{
    position:fixed; inset:0; z-index:40; background:var(--nuit);
    overflow-y:auto; padding:14px 14px calc(24px + env(safe-area-inset-bottom));
    display:none;
  }
  .sommaire.ouvert{ display:block; }
  .sommaire h2{
    font-size:12px; text-transform:uppercase; letter-spacing:.14em;
    padding:10px 0 14px; color:var(--sourdine);
  }
  .item{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:none; border:0; border-bottom:1px solid var(--ligne);
    color:var(--texte); font-family:var(--sans); font-size:16px;
    padding:13px 4px; cursor:pointer;
  }
  .item b{ font-family:var(--mono); font-size:13px; color:var(--ambre); min-width:34px; }
  .item i{ font-style:normal; color:var(--sourdine); font-size:13px; margin-left:auto; }

  /* ---------- carte ---------- */
  .scene{ padding:0 0 128px; }
  .carte{ padding:20px 14px 0; max-width:780px; margin:0 auto; }
  .rang{ display:flex; align-items:flex-start; gap:14px; margin-bottom:14px; }
  .index{
    font-family:var(--mono); font-size:50px; line-height:.82; font-weight:700;
    color:var(--ambre); font-variant-numeric:tabular-nums;
  }
  .index small{
    display:block; font-size:11px; letter-spacing:.1em; color:var(--sourdine);
    font-weight:400; margin-top:8px;
  }
  .code{ font-family:var(--mono); font-size:13px; letter-spacing:.1em; color:var(--rouge); font-weight:700; }
  .nom{ font-size:25px; font-weight:700; line-height:1.15; letter-spacing:-.015em; margin-top:2px; }


  /* ---------- etapes ---------- */
  .etape{ display:flex; gap:12px; margin-bottom:18px; }
  .puce{
    flex:none; width:26px; height:26px; border-radius:50%;
    border:1.5px solid var(--ambre); color:var(--ambre);
    font-family:var(--mono); font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; margin-top:2px;
  }
  .corps{ flex:1; min-width:0; }
  .corps p{ margin-bottom:9px; }
  .cadre{
    background:var(--surface); border:1px solid var(--ligne);
    border-radius:9px; overflow:hidden;
  }
  .cadre img{ display:block; width:100%; height:auto; }
  .vide{
    aspect-ratio:4/3; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; text-align:center;
    color:var(--sourdine); padding:18px;
    background:repeating-linear-gradient(45deg,var(--surface) 0 12px,var(--surface-2) 12px 24px);
  }
  .vide b{ color:var(--texte); font-size:15px; }
  .vide span{ font-family:var(--mono); font-size:12px; word-break:break-all; }

  .metas{ display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 6px; }
  .meta{
    font-family:var(--mono); font-size:12px; letter-spacing:.04em;
    border:1px solid var(--ligne); color:var(--sourdine);
    padding:6px 10px; border-radius:5px;
  }
  .meta.fort{ border-color:var(--rouge); color:var(--rouge); }

  /* ---------- pied ---------- */
  .pied{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:linear-gradient(to top,var(--nuit) 72%,rgba(20,16,13,0));
    padding:20px 14px calc(16px + env(safe-area-inset-bottom));
    display:flex; gap:10px; max-width:780px; margin:0 auto;
  }
  .btn{
    flex:1; font-family:var(--sans); font-size:16px; font-weight:700;
    letter-spacing:.03em; padding:17px 12px; border:1px solid var(--ligne);
    border-radius:10px; background:var(--surface-2); color:var(--texte);
    cursor:pointer; touch-action:manipulation;
  }
  .btn.avance{ flex:2; background:var(--ambre); border-color:var(--ambre); color:#14100D; }
  .btn:disabled{ opacity:.32; cursor:default; }
  .btn.fin{ background:var(--vert); border-color:var(--vert); color:#fff; }

  .aide{ max-width:780px; margin:22px auto 0; padding:0 14px; color:var(--sourdine); font-size:13px; }

  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

  /* ---------- impression ---------- */
  @media print{
    :root{ --texte:#000; --sourdine:#555; }
    body{ background:#fff; color:#000; font-size:10.5pt; }
    .barre,.pied,.aide,.sommaire{ display:none !important; }
    .scene{ padding:0; }
    .carte{
      padding:0 0 10mm; max-width:none;
      break-inside:avoid; page-break-inside:avoid;
      border-bottom:1px solid #bbb; margin-bottom:10mm;
    }
    .index{ color:#000; }
    .cadre{ border-color:#bbb; background:#fff; }
    .etape{ break-inside:avoid; page-break-inside:avoid; }
    .puce{ border-color:#000; color:#000; }
    .corps{ display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:start; }
    .corps p{ grid-column:1 / -1; }
    .vide{ background:#f7f6f4; border:1px dashed #bbb; }
    .meta{ border-color:#999; color:#555; }
    .meta.fort{ border-color:var(--rouge); color:var(--rouge); font-weight:700; }
  }
</style>
</head>

<body>

<header class="barre">
  <div class="barre-haut">
    <button class="ico" id="btnSommaire" type="button" aria-label="Liste des pointeaux">&#9776;</button>
    <span class="titre">Guide de ronde</span>
    <select class="selecteur" id="choixRonde" aria-label="Choisir le circuit"></select>
  </div>
  <div class="jauge" id="jauge"></div>
</header>

<div class="sommaire" id="sommaire" role="dialog" aria-label="Liste des pointeaux">
  <h2>Tous les pointeaux</h2>
  <div id="listeSommaire"></div>
</div>

<main class="scene" id="scene" aria-live="polite"></main>

<nav class="pied">
  <button class="btn" id="btnPrec" type="button">Precedent</button>
  <button class="btn avance" id="btnSuiv" type="button">Suivant</button>
</nav>

<p class="aide" id="aide"></p>

<script>
(function(){
  "use strict";

  var scene = document.getElementById("scene");
  var jauge = document.getElementById("jauge");
  var choix = document.getElementById("choixRonde");
  var prec  = document.getElementById("btnPrec");
  var suiv  = document.getElementById("btnSuiv");
  var aide  = document.getElementById("aide");
  var som   = document.getElementById("sommaire");
  var liste = document.getElementById("listeSommaire");
  var btnSom= document.getElementById("btnSommaire");

  var iR = 0, iP = 0, impression = false;

  RONDES.forEach(function(r,i){
    var o=document.createElement("option"); o.value=i; o.textContent=r.nom; choix.appendChild(o);
  });
  choix.style.display = RONDES.length>1 ? "" : "none";

  function ronde(){ return RONDES[iR]; }
  function pts(){ return ronde().pointeaux; }

  function ech(t){
    return String(t==null?"":t)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function photo(src){
    if(!src) return "";
    return '<div class="cadre"><img src="'+ech(src)+'" alt="" onerror="GUIDE.rate(this)"></div>';
  }

  function reperes(p){
    var t = [];
    if(p.statut === "absent"){ t.push('<span class="meta">Pointeau absent</span>'); }
    if(p.statut === "difficile"){ t.push('<span class="meta">Pointeau peu visible</span>'); }
    if(p.position === "interne"){
      t.push('<span class="meta">Interne</span>');
    } else if(p.position === "externe"){
      t.push('<span class="meta">Externe</span>');
    }
    if(p.acces){ t.push('<span class="meta fort">'+ech(p.acces)+'</span>'); }
    return t.length ? '<div class="metas">'+t.join("")+'</div>' : "";
  }

  function carte(p,n,total){
    var et = (p.etapes||[]).filter(function(e){ return e && (e.img || e.texte); });

    var corps = et.map(function(e,i){
      return '<div class="etape"'+(e.texte?'':' data-auto="1"')+'>'
        + '<div class="puce">'+(i+1)+'</div>'
        + '<div class="corps">'
        +   (e.texte ? '<p>'+ech(e.texte)+'</p>' : "")
        +   photo(e.img)
        + '</div></div>';
    }).join("");

    if(!et.length){
      corps = '<div class="cadre"><div class="vide"><b>A completer</b>'
        + '<span>etapes: [ ... ]</span></div></div>';
    }

    return '<article class="carte">'
      + '<div class="rang">'
      +   '<div class="index">'+String(n).padStart(2,"0")
      +     '<small>SUR '+String(total).padStart(2,"0")+'</small></div>'
      +   '<div><div class="code">'+ech(p.code)+'</div>'
      +   '<h1 class="nom">'+ech(p.nom || "Sans nom")+'</h1></div>'
      + '</div>'
      + reperes(p)
      + corps
      + '</article>';
  }

  // Une etape sans texte dont la photo n'existe pas est retiree :
  // le guide s'adapte tout seul au nombre reel de photos.
  window.GUIDE = {
    rate: function(img){
      var et = img.parentNode ? img.parentNode.parentNode : null;
      while(et && et.className.indexOf("etape") === -1){ et = et.parentNode; }
      if(!et){
        if(img.parentNode){
          img.parentNode.innerHTML = '<div class="vide"><b>Photo introuvable</b><span>'
            + ech(img.getAttribute("src")) + '</span></div>';
        }
        return;
      }
      if(et.getAttribute("data-auto") === "1"){
        var art = et.parentNode;
        art.removeChild(et);
        renumerote(art);
      } else {
        img.parentNode.innerHTML = '<div class="vide"><b>Photo introuvable</b><span>'
          + ech(img.getAttribute("src")) + '</span></div>';
      }
    }
  };

  function renumerote(art){
    if(!art) return;
    Array.prototype.forEach.call(art.querySelectorAll(".etape"), function(et,i){
      var pu = et.querySelector(".puce");
      if(pu) pu.textContent = i+1;
    });
    if(!art.querySelector(".etape")){
      var v = document.createElement("div");
      v.className = "cadre";
      v.innerHTML = '<div class="vide"><b>Aucune photo</b><span>dossier photos/</span></div>';
      art.appendChild(v);
    }
  }

  function dessineJauge(){
    jauge.innerHTML="";
    pts().forEach(function(_,i){
      var s=document.createElement("span");
      if(i<iP) s.className="faite";
      if(i===iP) s.className="active";
      jauge.appendChild(s);
    });
  }

  function dessineSommaire(){
    liste.innerHTML="";
    pts().forEach(function(p,i){
      var b=document.createElement("button");
      b.className="item"; b.type="button";
      var nb=(p.etapes||[]).filter(function(e){return e&&e.img;}).length;
      var fin = p.statut==="absent" ? "Pointeau absent" : nb+' photo'+(nb>1?"s":"");
      b.innerHTML='<b>'+ech(p.code)+'</b>'
        + '<span>'+ech(p.nom||"Sans nom")+'</span>'
        + '<i>'+fin+'</i>';
      b.addEventListener("click",function(){
        iP=i; som.classList.remove("ouvert"); rendu();
      });
      liste.appendChild(b);
    });
  }

  function rendu(){
    var l=pts();
    if(!l.length){ scene.innerHTML='<article class="carte"><p>Aucun pointeau.</p></article>'; return; }

    if(impression){
      scene.innerHTML=l.map(function(p,i){ return carte(p,i+1,l.length); }).join("");
        return;
    }

    scene.innerHTML=carte(l[iP],iP+1,l.length);
    dessineJauge();
    prec.disabled=(iP===0);
    var dernier=(iP===l.length-1);
    suiv.textContent=dernier?"Ronde terminee":"Suivant";
    suiv.classList.toggle("fin",dernier);
    suiv.disabled=dernier;
    aide.textContent=(ronde().sousTitre||"")+(ronde().depart?" - depart : "+ronde().depart:"");
    window.scrollTo(0,0);
  }

  function bouge(d){
    var n=iP+d;
    if(n<0||n>=pts().length) return;
    iP=n; rendu();
  }

  prec.addEventListener("click",function(){ bouge(-1); });
  suiv.addEventListener("click",function(){ bouge(1); });
  choix.addEventListener("change",function(){ iR=Number(choix.value); iP=0; dessineSommaire(); rendu(); });

  btnSom.addEventListener("click",function(){
    dessineSommaire();
    som.classList.toggle("ouvert");
  });

  document.addEventListener("keydown",function(e){
    if(e.key==="Escape") som.classList.remove("ouvert");
    if(som.classList.contains("ouvert")) return;
    if(e.key==="ArrowRight") bouge(1);
    if(e.key==="ArrowLeft")  bouge(-1);
  });

  var x0=null,y0=null;
  document.addEventListener("touchstart",function(e){
    x0=e.changedTouches[0].clientX; y0=e.changedTouches[0].clientY;
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(x0===null||som.classList.contains("ouvert")) return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.8) bouge(dx<0?1:-1);
    x0=null; y0=null;
  },{passive:true});

  window.addEventListener("beforeprint",function(){ impression=true; rendu(); });
  window.addEventListener("afterprint", function(){ impression=false; rendu(); });

  dessineSommaire();
  rendu();
})();
</script>

</body>
</html>
